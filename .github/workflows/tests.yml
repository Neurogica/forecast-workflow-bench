name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update and verify the Ubuntu CA store
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --only-upgrade ca-certificates
          python scripts/security/check_build_tls_trust.py system
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
      - name: Bootstrap pip with patched uv and verify build trust stores
        run: |
          uv pip install --system pip==26.2.2
          python scripts/security/check_build_tls_trust.py system pip uv
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync python -m ruff check src tests leaderboard scripts
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync python -m forecast_workflow.cli results --input leaderboard/results.json
