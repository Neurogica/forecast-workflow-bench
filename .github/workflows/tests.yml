name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.8
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync python -m ruff check src tests leaderboard scripts
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync python -m forecast_workflow.cli results --input leaderboard/results.json
